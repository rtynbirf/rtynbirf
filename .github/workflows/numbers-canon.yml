name: КАНОН ЦИФР · сверка пяти

on:
  schedule:
    - cron: "10 4 * * *"   # после 3d-contrib (03:40) и swarm-sync (03:17); крон может душиться — заводит ЗАВОДНОЙ КЛЮЧ
  workflow_dispatch: {}
concurrency:
  group: numbers-canon
  cancel-in-progress: false

permissions:
  contents: write   # заход 6: пуш канона — GITHUB_TOKEN (рука роя SWARM_TOKEN протухла: HTTP 401)

jobs:
  canon:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-канон)
        with:
          persist-credentials: false  # волна 14: без extraheader — пуш рукой роя (SWARM_TOKEN)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 (SHA-канон)
        with:
          python-version: "3.12"
      - name: измерение канона (полный обзор)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/numbers_canon.py
      - name: толчок канона (bot + rebase + skip ci)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "numbers-canon[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # волна 12: ребейз — только на чистом дереве. Коммит сначала, ребейз после:
          # артефакт уже написан, но до коммита он «unstaged changes» и зуб отказывается кусать.
          git add swarm_numbers.json
          if git diff --cached --quiet; then
            echo "канон не изменился — коммит не нужен (анти-шум)"
          else
            git commit -m "⟳ канон цифр: сверка пяти приведена к реальности (автомат) [skip ci]"
            git pull --rebase origin main
            # волна 13: пуш — рукой роя; заход 6: рука протухла — GITHUB_TOKEN с contents:write
            # волна 14: extraheader checkout перекрывает URL-креды → 403 github-actions[bot]
            git config --unset-all http.https://github.com/.extraheader || true
            git config --worktree --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
