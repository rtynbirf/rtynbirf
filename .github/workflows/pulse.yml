name: пульс-правды
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pulse-truth
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: перемерить дом
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .forge/gen_pulse.py
      - name: толчок правды
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "цифры = реальность, правды не требуется"
          else
            git commit -m "⟳ пульс правды: цифры дома приведены к реальности (автомат)"
            # волна 12: пуш каждые 30 минут = самый частый источник гонки; ребейз — зуб
            git pull --rebase origin main
            git push
          fi
