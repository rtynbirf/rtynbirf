name: пульс-правды
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write   # заход 6: пульс пишет правду в main — GITHUB_TOKEN (рука роя протухла: HTTP 401)
concurrency:
  group: pulse-truth
  cancel-in-progress: false
jobs:
  pulse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-канон)
        with:
          persist-credentials: false   # волна 14: без extraheader — анонимный fetch + пуш рукой роя (SWARM_TOKEN)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 (SHA-канон)
        with:
          python-version: "3.12"
      - name: перемерить дом
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .forge/gen_pulse.py
      - name: толчок правды
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "цифры = реальность, правды не требуется"
          else
            git commit -m "⟳ пульс правды: цифры дома приведены к реальности (автомат)"
            # волна 12: пуш каждые 30 минут = самый частый источник гонки; ребейз — зуб
            git pull --rebase origin main
            # волна 13: пуш — рукой роя; заход 6: рука протухла — GITHUB_TOKEN с contents:write
            # волна 14: extraheader от checkout перекрывает URL-креды → 403 github-actions[bot]; снимаем в обоих скоупах
            git config --unset-all http.https://github.com/.extraheader || true
            git config --worktree --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
