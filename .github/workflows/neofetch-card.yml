name: ТЕРМИНАЛ РОЯ (neofetch-карта)

on:
  schedule:
    - cron: "50 4 * * *"
  workflow_dispatch: {}
concurrency:
  group: neofetch-card
  cancel-in-progress: true

permissions:
  contents: write   # заход 5: пуш карты в main — GITHUB_TOKEN (рука роя SWARM_TOKEN протухла: HTTP 401)

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # волна 14: без extraheader — пуш рукой роя (SWARM_TOKEN)
      - name: Генерация карты (методика SWARM-SYNC)
        run: python3 scripts/neofetch_card.py assets/neofetch.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Коммит карты (только при изменениях)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "карта не изменилась — коммит не нужен (анти-шум)"
          else
            git commit -m "ТЕРМИНАЛ: суточная neofetch-карта [skip ci]"
            # волна 12: пуш в main — общий ресурс роя; ребейз перед пушем — зуб против «fetch first»
            git pull --rebase origin main
            # волна 13: пуш — рукой роя; заход 5: рука протухла — GITHUB_TOKEN с contents:write
            # волна 14: extraheader checkout перекрывает URL-креды → 403 github-actions[bot]
            git config --unset-all http.https://github.com/.extraheader || true
            git config --worktree --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
