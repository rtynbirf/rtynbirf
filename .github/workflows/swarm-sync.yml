name: SWARM-SYNC (сверка со средой)

on:
  schedule:
    - cron: '17 3 * * *'   # ежедневно; минута 17 — смещение от пика нагрузки (best practice)
  workflow_dispatch: {}      # ручной запуск всегда доступен

concurrency:
  group: swarm-sync-${{ github.repository }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
      - name: Сверка со средой -> регенерация секции README
        run: python scripts/swarm_sync.py
        env:
          SWARM_TOKEN: ${{ secrets.SWARM_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Коммит только при реальных изменениях (bot + skip ci)
        run: |
          if git diff --quiet -- README.md; then
            echo "README без изменений — коммит не нужен"
          else
            git config user.name "swarm-sync[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "swarm-sync: сверка со средой [skip ci]"
            # урок волны ×5 / волна 12: клетки роя пушат в main параллельно —
            # голый push падает «fetch first». Ребейз перед пушем — не опция, а зуб.
            git pull --rebase origin main
            git push
          fi
