name: ЗАКОНОДАТЕЛЬ · волна закона (правило 28)

# Заход 6 (2026-11-21): правки закона флота — только через этот диспатч.
# Батч ≤ limit тел за прогон, идемпотентность по маркеру блока (scripts/zakonodatel.py).
# Ручные волновые пушы запрещены правилом 28 (шрамы 2026-11-21 в KNOWN_ISSUES).

on:
  workflow_dispatch:
    inputs:
      file:
        description: "файл дельты закона в корне репо (markdown)"
        required: true
        default: "закон-дельта.md"
      message:
        description: "commit message (правило 12: что сделано + REVE=РЕВО)"
        required: true
      limit:
        description: "батч тел за прогон (≤20)"
        required: false
        default: "20"

permissions:
  contents: write   # правка AGENTS.md во флоте и протокола в main — GITHUB_TOKEN

concurrency:
  group: zakonodatel
  cancel-in-progress: false   # волны не перебивают друг друга

jobs:
  wave:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-канон)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 (SHA-канон)
        with:
          python-version: "3.12"
      - name: волна закона (батч, идемпотентно, с паузами)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/zakonodatel.py \
            --file "${{ github.event.inputs.file }}" \
            --message "${{ github.event.inputs.message }}" \
            --limit "${{ github.event.inputs.limit }}"
      - name: протокол волны → main
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "zakonodatel[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zakonodatel-protokol.jsonl
          if git diff --cached --quiet; then
            echo "протокол без изменений (анти-шум)"
          else
            git commit -m "ЗАКОНОДАТЕЛЬ: протокол волны закона [skip ci]"
            git pull --rebase origin main
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
