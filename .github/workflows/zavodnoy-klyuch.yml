name: ЗАВОДНОЙ КЛЮЧ · завод спящих

on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: zavodnoy-klyuch
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: завод просроченных клеток
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/zavodnoy_klyuch.py
