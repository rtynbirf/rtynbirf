name: ЗАВОДНОЙ КЛЮЧ · завод спящих

on:
  push:
    branches: [main]
  workflow_dispatch: {}
concurrency:
  group: zavodnoy-klyuch
  cancel-in-progress: true

permissions:
  contents: read
  actions: write   # заход 5: рука роя SWARM_TOKEN протухла (HTTP 401) — законный GITHUB_TOKEN
                   # с явным правом диспетчинга (прецедент: СЕРДЦЕ ТАКТА, зелёный)

jobs:
  wind:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA-канон)
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7 (SHA-канон)
        with:
          python-version: "3.12"
      - name: завод просроченных клеток
        env:
          # заход 5: SWARM_TOKEN протух (401 на GET workflows) — GITHUB_TOKEN с
          # actions:write, объявленным в permissions (исключение точечно, волна 13→14)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/zavodnoy_klyuch.py
