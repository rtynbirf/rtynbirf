name: generate snake
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions: read-all
concurrency:
  group: generate-snake
  cancel-in-progress: true
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake SVGs
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: rtynbirf
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=orange&color_dots=#0d1117,#1f3521,#2e5c33,#3f8a4b,#54c56a
      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v5
        with:
          target_branch: output
          build_dir: dist
        env:
          # волна 13: пуш в output — рукой роя (SWARM_TOKEN); GITHUB_TOKEN read-only
          GITHUB_TOKEN: ${{ secrets.SWARM_TOKEN }}
