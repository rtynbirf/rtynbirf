name: 3D contrib (свет вселенной)

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}
concurrency:
  group: 3d-contrib
  cancel-in-progress: true

permissions:
  contents: write   # заход 6: пуш генерации — GITHUB_TOKEN (рука роя SWARM_TOKEN протухла: HTTP 401)

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false  # волна 14: без extraheader — пуш рукой роя (SWARM_TOKEN)
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          # заход 6: API-обзор — GITHUB_TOKEN (рука роя протухла)
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: rtynbirf
      - name: Commit 3D
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "изменений нет (анти-шум)"
          else
            git commit -m "3D-contrib: автогенерация"
            # волна 12: пуш в main — общий ресурс роя; ребейз перед пушем — зуб против «fetch first»
            git pull --rebase origin main
            # волна 13: пуш — рукой роя; заход 6: рука протухла — GITHUB_TOKEN с contents:write
            # волна 14: extraheader checkout перекрывает URL-креды → 403 github-actions[bot]
            git config --unset-all http.https://github.com/.extraheader || true
            git config --worktree --unset-all http.https://github.com/.extraheader 2>/dev/null || true
            git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
