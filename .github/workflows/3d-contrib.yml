name: 3D contrib (свет вселенной)

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}
concurrency:
  group: 3d-contrib
  cancel-in-progress: true

permissions: read-all

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          # волна 13: GITHUB_TOKEN в доме read-only; API-обзор — рукой роя
          GITHUB_TOKEN: ${{ secrets.SWARM_TOKEN }}
          USERNAME: rtynbirf
      - name: Commit 3D
        env:
          SWARM_TOKEN: ${{ secrets.SWARM_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "изменений нет (анти-шум)"
          else
            git commit -m "3D-contrib: автогенерация"
            # волна 12: пуш в main — общий ресурс роя; ребейз перед пушем — зуб против «fetch first»
            git pull --rebase origin main
            # волна 13: пуш — рукой роя (SWARM_TOKEN)
            git push "https://x-access-token:${SWARM_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
