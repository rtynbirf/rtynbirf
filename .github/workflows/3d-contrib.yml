name: 3D contrib (свет вселенной)

on:
  schedule:
    - cron: "40 3 * * *"
  workflow_dispatch: {}
concurrency:
  group: 3d-contrib
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39 # v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.SWARM_TOKEN || secrets.GITHUB_TOKEN }}
          USERNAME: rtynbirf
      - name: Commit 3D
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "3D-contrib: автогенерация" || echo "изменений нет"
          git push
