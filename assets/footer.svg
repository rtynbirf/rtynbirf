<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-label="офлайн живёт здесь">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0620"/>
      <stop offset="1" stop-color="#2E2540"/>
    </linearGradient>
    <linearGradient id="fwave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="150" rx="14" fill="url(#fbg)"/>
  <g fill="#FFFFFF">
    <circle cx="120" cy="40" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="380" cy="26" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="2.6s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="52" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.4s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="900" cy="30" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="1.5s" repeatCount="indefinite"/></circle>
    <circle cx="1100" cy="58" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" begin="0.8s" repeatCount="indefinite"/></circle>
  </g>
  <path d="M0,112 C200,86 400,120 600,102 C800,86 1000,118 1200,96 L1200,150 L0,150 Z" fill="url(#fwave)" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="0 0; -50 0; 0 0" dur="14s" repeatCount="indefinite"/>
  </path>
  <text x="600" y="62" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="24" font-weight="700" letter-spacing="3" fill="#E9E4F5">ОФЛАЙН ЖИВЁТ ЗДЕСЬ</text>
  <text x="600" y="90" text-anchor="middle" font-family="'Segoe UI', 'Noto Sans', sans-serif" font-size="14" letter-spacing="1" fill="#9B8FB8">строю то, что работает без интернета и без разрешений</text>
</svg>
